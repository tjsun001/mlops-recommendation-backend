name: Build and Deploy product-service to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional existing image tag to deploy (skips build)
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: product-service-ecs
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPO: product-service
  ECS_CLUSTER: mlops-poc-dev-ecs-cluster
  ECS_SERVICE: mlops-poc-dev-product-service
  CONTAINER_NAME: product-service
  TASK_DEFINITION_FILE: ecs/task-definition.json

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert running on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Must run on main branch"
            exit 1
          fi

      - name: Ensure task definition exists
        run: |
          test -f "${{ env.TASK_DEFINITION_FILE }}" || exit 1

      - name: Resolve build mode
        id: mode
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi

      - name: Setup Java
        if: env.SKIP_BUILD == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set IMAGE_URI from existing tag
        if: env.SKIP_BUILD == 'true'
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPO }}:${{ inputs.image_tag }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Build and push image
        if: env.SKIP_BUILD == 'false'
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG="sha-${GITHUB_SHA}"
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPO }}:$IMAGE_TAG"

          mvn -B -ntp -DskipTests clean package jib:build \
            -Dimage="$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Render ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_FILE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      # HARD GATE #1
      - name: Verify rendered task definition image
        run: |
          EXPECTED="${{ env.IMAGE_URI }}"
          FILE="${{ steps.render.outputs.task-definition }}"

          ACTUAL=$(jq -r '.containerDefinitions[0].image' "$FILE")

          echo "EXPECTED=$EXPECTED"
          echo "ACTUAL=$ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Image mismatch"
            exit 1
          fi

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

      # HARD GATE #2
      - name: Verify ECS service image
        run: |
          EXPECTED="${{ env.IMAGE_URI }}"

          TD=$(aws ecs describe-services \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --query "services[0].taskDefinition" \
            --output text)

          ACTUAL=$(aws ecs describe-task-definition \
            --task-definition "$TD" \
            --query "taskDefinition.containerDefinitions[0].image" \
            --output text)

          echo "EXPECTED=$EXPECTED"
          echo "ACTUAL=$ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Service running wrong image"
            exit 1
          fi

          echo "Deployment verified successfully"